{% extends "base.html" %}{% block content %}
<h1>Leaderboard: {{ quiz.title }}</h1><div class="card"><table><tr><th>#</th><th>User</th><th>Best score</th></tr>
{% for a in rows %}<tr><td>{{ forloop.counter }}</td><td>{{ a.user.username }}</td><td>{{ a.percent }}%</td></tr>
{% empty %}<tr><td colspan="3">No attempts yet.</td></tr>{% endfor %}</table></div>{% endblock %}
